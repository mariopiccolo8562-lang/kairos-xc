name: App Kairos XC (APK)

# - ogni modifica compila un APK di prova (scheda Actions → Artifacts)
# - un tag vX.Y.Z (Releases → Draft a new release) pubblica la versione:
#   https://github.com/<utente>/kairos-xc/releases/latest/download/kairos-xc.apk  (link fisso per Downloader)
#   https://github.com/<utente>/kairos-xc/releases/latest/download/kairos-xc.json (letto dal pannello: aggiornamento automatico)
on:
  push:
    branches: ['**']
    tags: ['v*', 'V*', '[0-9]*']   # vale anche «V3.0.2» o «3.0.1»: la release si pubblica lo stesso
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Chiave di firma
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KS_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF" =~ ^refs/tags/[vV]?[0-9] ]]; then
            echo "::error::Mancano i segreti della chiave di firma (vedi README): senza, gli aggiornamenti non si installerebbero sopra la versione precedente"
            exit 1
          else
            echo "::warning::Nessuna chiave di firma: APK di prova firmato con una chiave temporanea"
          fi

      - name: Versione
        run: |
          if [[ "$GITHUB_REF" =~ ^refs/tags/[vV]?([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            V="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
            CODE=$(( BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3] ))   # es. 1.2.3 → 10203
            echo "IS_TAG=1" >> "$GITHUB_ENV"
          else
            V="0.0.${GITHUB_RUN_NUMBER}"; CODE=${GITHUB_RUN_NUMBER}                          # build di prova
          fi
          echo "VERSION_NAME=$V" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$CODE" >> "$GITHUB_ENV"

      # prima le prove JVM (app/src/test: comandi del pannello, conti dello speed test), poi l'APK
      - name: Prove e compilazione APK
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KAIROS_SERVER_URL: ${{ vars.KAIROS_SERVER_URL }}
          KAIROS_DL_BASE: ${{ vars.KAIROS_DL_BASE }}   # indirizzo dei download (predefinito https://panel-kairos.com)
          XC_APP_NAME: ${{ vars.XC_APP_NAME }}
          XC_APP_ID: ${{ vars.XC_APP_ID }}
        run: gradle testReleaseUnitTest assembleRelease --no-daemon --stacktrace

      - run: cp app/build/outputs/apk/release/app-release.apk kairos-xc.apk

      - uses: actions/upload-artifact@v4
        with:
          name: kairos-xc-apk-${{ env.VERSION_NAME }}
          path: kairos-xc.apk

      - name: File per l'aggiornamento automatico
        if: startsWith(github.ref, 'refs/tags/') && env.IS_TAG == '1'
        run: |
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/kairos-xc.apk"
          jq -n --arg v "$VERSION_NAME" --argjson c "$VERSION_CODE" --arg u "$URL" --arg d "$(date -u +%FT%TZ)" \
            '{version:$v, versionCode:$c, url:$u, date:$d}' > kairos-xc.json
          cat kairos-xc.json

      - name: Pubblica la release
        if: startsWith(github.ref, 'refs/tags/') && env.IS_TAG == '1'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            kairos-xc.apk
            kairos-xc.json
          make_latest: true
          name: Kairos XC ${{ env.VERSION_NAME }}
          generate_release_notes: true
