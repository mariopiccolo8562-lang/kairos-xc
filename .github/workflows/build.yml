name: App Kairos XC (APK)

# - ogni modifica compila un APK di prova (scheda Actions → Artifacts)
# - per pubblicare una versione basta cambiare il numero in versione.txt su main: tag e release li crea questa compilazione
#   (regola in .github/scripts/versione.sh: solo da main, solo se la versione è nuova e più alta dell'ultima)
# - vale ancora anche il tag vX.Y.Z creato a mano (Releases → Draft a new release). La release pubblica:
#   https://github.com/<utente>/kairos-xc/releases/latest/download/kairos-xc.apk  (link fisso per Downloader)
#   https://github.com/<utente>/kairos-xc/releases/latest/download/kairos-xc.json (letto dal pannello: aggiornamento automatico)
on:
  push:
    branches: ['**']
    tags: ['v*', 'V*', '[0-9]*']   # vale anche «V3.0.2» o «3.0.1»: la release si pubblica lo stesso
  workflow_dispatch:

permissions:
  contents: write

# su main una compilazione alla volta: due modifiche vicine non pubblicano due volte la stessa versione
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'rilascio-main' || github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # prima di tutto: è una compilazione di prova o una release (da tag, o da versione.txt su main)?
      - name: Versione
        run: |
          bash .github/scripts/versione_test.sh .github/scripts/versione.sh
          TAGS_OK=0; TAGS=""
          if T="$(git ls-remote --tags origin 2>/dev/null)"; then
            TAGS="$(printf '%s\n' "$T" | sed 's#.*refs/tags/##; s#\^{}$##')"; TAGS_OK=1
          fi
          TAGS="$TAGS" TAGS_OK="$TAGS_OK" bash .github/scripts/versione.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Chiave di firma
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KS_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          elif [ "$IS_RELEASE" = "1" ] || [[ "$GITHUB_REF" =~ ^refs/tags/[vV]?[0-9] ]]; then
            echo "::error::Mancano i segreti della chiave di firma (vedi README): senza, gli aggiornamenti non si installerebbero sopra la versione precedente"
            exit 1
          else
            echo "::warning::Nessuna chiave di firma: APK di prova firmato con una chiave temporanea"
          fi

      # prima le prove JVM (app/src/test: comandi del pannello, conti dello speed test), poi l'APK
      - name: Prove e compilazione APK
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KAIROS_SERVER_URL: ${{ vars.KAIROS_SERVER_URL }}
          KAIROS_DL_BASE: ${{ vars.KAIROS_DL_BASE }}   # indirizzo dei download (predefinito https://store-k.download)
          KAIROS_DL_BASE2: ${{ vars.KAIROS_DL_BASE2 }}  # secondo dominio dei download, di riserva (facoltativo)
          XC_APP_NAME: ${{ vars.XC_APP_NAME }}
          XC_APP_ID: ${{ vars.XC_APP_ID }}
        run: gradle testReleaseUnitTest assembleRelease --no-daemon --stacktrace

      - run: cp app/build/outputs/apk/release/app-release.apk kairos-xc.apk

      - uses: actions/upload-artifact@v4
        with:
          name: kairos-xc-apk-${{ env.VERSION_NAME }}
          path: kairos-xc.apk

      - name: File per l'aggiornamento automatico
        if: env.IS_RELEASE == '1'
        run: |
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${REL_TAG}/kairos-xc.apk"
          jq -n --arg v "$VERSION_NAME" --argjson c "$VERSION_CODE" --arg u "$URL" --arg d "$(date -u +%FT%TZ)" \
            '{version:$v, versionCode:$c, url:$u, date:$d}' > kairos-xc.json
          cat kairos-xc.json

      - name: Pubblica la release
        if: env.IS_RELEASE == '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.REL_TAG }}          # da versione.txt il tag non c'è ancora: lo crea la release, su questo commit
          target_commitish: ${{ github.sha }}
          files: |
            kairos-xc.apk
            kairos-xc.json
          make_latest: true
          name: Kairos XC ${{ env.VERSION_NAME }}
          generate_release_notes: true
